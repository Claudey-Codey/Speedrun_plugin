name: HourDuel
version: '${project.version}'
main: dev.hourduel.HourDuelPlugin
api-version: '26.2'
description: '${project.description}'
author: Hour Duel
commands:
  hourduel:
    description: Hour Duel game commands
    usage: /hourduel <menu|info|stop|time>
    aliases: [hd]
  toggle:
    description: Toggle game HUD options
    usage: /toggle timer
permissions:
  hourduel.admin:
    description: Admin commands (/hourduel stop, /hourduel time)
    default: op
