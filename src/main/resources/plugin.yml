name: Dueley
version: '${project.version}'
main: dev.dueley.DueleyPlugin
api-version: '26.2'
description: '${project.description}'
author: Tuni
commands:
  dueley:
    description: Dueley game commands
    usage: /dueley <menu|info|stop|time>
    aliases: [dy]
  toggle:
    description: Toggle game HUD options
    usage: /toggle timer
permissions:
  dueley.admin:
    description: Admin commands (/dueley stop, /dueley time)
    default: op
