name: Dueley
version: '${project.version}'
main: dev.dueley.DueleyPlugin
api-version: '26.2'
description: '${project.description}'
author: Tuni
commands:
  dueley:
    description: Dueley game commands
    usage: /dueley <menu|info|toggle_timer|stop|time|debug>
    aliases: [dy]
permissions:
  dueley.admin:
    description: Admin commands (/dueley stop, /dueley time, /dueley debug)
    default: op
